services:
  postgres:
    image: postgres:16
    container_name: family_books_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_books
      POSTGRES_PASSWORD: family_books
      POSTGRES_DB: family_books
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_books -d family_books"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: family_books_pgdata
