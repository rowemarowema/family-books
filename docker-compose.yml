services:
  postgres:
    image: postgres:16
    container_name: family_books_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_books
      POSTGRES_PASSWORD: family_books
      POSTGRES_DB: family_books
    ports:
      # Host side 5433 (not 5432) so a Family Books Postgres can coexist
      # with Mark's parallel rowe-contest-postgres-1 container. Container
      # side stays 5432 — DATABASE_URL from inside the container network
      # would still use 5432, but we connect from the host.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_books -d family_books"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: family_books_pgdata
