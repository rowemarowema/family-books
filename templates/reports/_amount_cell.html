{% if allow_none and value is None %}
  <td class="text-end" data-cell="{{ cell }}" data-value=""></td>
{% else %}
  <td class="text-end" data-cell="{{ cell }}" data-value="{{ value }}">
    {% if value < 0 %}({{ value|floatformat:2|cut:"-" }}){% else %}{{ value|floatformat:2 }}{% endif %}
  </td>
{% endif %}
