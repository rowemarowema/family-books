upstream family_books_web {
    server web:8000;
    keepalive 32;
}

# ---------- HTTP :80 ----------
# Serves the ACME http-01 challenge (Let's Encrypt / certbot renewals)
# and redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name books.markrowecontest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name books.markrowecontest.com;

    ssl_certificate     /etc/letsencrypt/live/books.markrowecontest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.markrowecontest.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Single-user app, modest payloads (CSV imports are the largest).
    client_max_body_size 5m;

    # Proxy everything to gunicorn. WhiteNoise serves static files
    # from inside the container; nginx just proxies the request.
    location / {
        proxy_pass         http://family_books_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Match gunicorn's --timeout 60s; nginx times out at the
        # same boundary so a slow request fails one place, not two.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
