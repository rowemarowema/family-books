name: CI

# Triggers: every push (any branch) AND every PR targeting main.
# Feature-branch pushes give early signal; PR runs catch the merged-
# into-main result. Concurrency below dedupes rapid-fire pushes on
# the same ref so we don't pile up runs.
on:
  push:
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push lands. Saves
# CI minutes during rapid iteration; the latest commit is the one we
# care about.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    # Postgres service container, pinned to 16 to match production
    # (Render). Health check ensures the job waits until pg_isready
    # before running migrations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family_books
          POSTGRES_PASSWORD: family_books
          POSTGRES_DB: family_books_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_books"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: family_books.settings.test
      # test.py reads TEST_DATABASE_URL when present and overrides the
      # base.py DATABASES dict. See family_books/settings/test.py:19.
      TEST_DATABASE_URL: postgres://family_books:family_books@localhost:5432/family_books_test
      # base.py expects SECRET_KEY env var; default is dev-insecure, so
      # we set an explicit CI-only value.
      SECRET_KEY: ci-not-a-real-secret-do-not-use-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Hash pyproject.toml to key the pip wheel cache. New deps
          # busts the cache; otherwise it's reused across runs.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install GTK system libraries (WeasyPrint)
        # Required for the F.5 PDF export tests to actually run on
        # Linux. Without these, weasyprint imports fail and the PDF
        # tests would skip via SKIP_PDF_ON_WINDOWS_NO_GTK only on
        # Windows; on Linux without GTK they'd fail outright.
        # Mirrors the apt-install line in render.yaml.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: pip install -e .[dev]

      - name: Step 1 — make check (Django system checks)
        run: make check

      - name: Step 2 — make migrate (apply migrations on a fresh DB)
        run: make migrate

      - name: Step 2.5 — make check-deploy (Warnings → Errors)
        # Refinement #1 from the H.4 breakdown: CI runs check-deploy
        # so the WeasyPrint W001 check fires as a build-failing
        # error if GTK isn't installed in the runner. Production
        # (render.yaml) runs the same target. Local `make check` keeps
        # WeasyPrint as a Warning so Windows dev isn't blocked.
        run: make check-deploy

      - name: Step 3 — makemigrations --dry-run (must report no changes)
        run: |
          OUTPUT=$(python manage.py makemigrations --dry-run 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No changes detected" || (
            echo "::error::Model-vs-migration drift detected; see output above"
            exit 1
          )

      - name: Step 4 — make lint (ruff)
        # Ordered before tests so style breaks fail fast (cheaper to
        # diagnose than test failures); cycles aren't wasted on the
        # test suite when a trivial lint break is in the diff.
        run: make lint

      - name: Step 5 — make typecheck (mypy on books.accounting; informational)
        # INFORMATIONAL ONLY in Group G. mypy on books.accounting
        # surfaces ~71 missing-annotation findings accumulated across
        # Groups D-F; fixing them is a Group I cleanup task in its own
        # right and not in scope for Group G's CI hardening. The step
        # runs so the count stays visible in CI logs over time, but it
        # does NOT gate the build. Re-promote to gating in Group I once
        # the annotation backlog is cleared. See docs/CI.md and the
        # PROGRESS.md "Deferred" list for the activation plan.
        continue-on-error: true
        run: make typecheck

      - name: Step 6 — make test (pytest with coverage gate)
        # Coverage floor of 88% is enforced by
        # [tool.coverage.report] fail_under in pyproject.toml; pytest-
        # cov respects it and exits non-zero if below.
        run: make test
