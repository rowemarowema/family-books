[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "family-books"
version = "0.1.0"
description = "Single-user cloud-hosted personal finance system for the Rowe household"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mark Rowe" }]
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<1.0",
    "argon2-cffi>=23.1",
    "django-allauth>=64.0,<66.0",
    "django-two-factor-auth>=1.17,<2.0",
    "django-formtools>=2.5,<3.0",
    "django-axes>=7.0,<8.0",
    "openpyxl>=3.1,<4.0",
    # Group F.5 PDF export. Required in production. Render build needs
    # libpango / libgdk-pixbuf system libs (see docs/SETUP.md). Local
    # Windows dev without GTK degrades to 503 via lazy import in
    # books/accounting/reports/exporters/pdf_export.py.
    "weasyprint>=62.0,<70.0",
    "pyyaml>=6.0,<7.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.7,<7.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "factory-boy>=3.3,<4.0",
    "faker>=30.0,<40.0",
    # Group F.4: cell-level tie-out test parses rendered HTML and
    # asserts each data-value matches the engine field. Test-only.
    "beautifulsoup4>=4.12,<5.0",
    # Group F.5: PDF smoke test extracts text from the rendered PDF
    # and asserts known amounts appear. Test-only.
    "pypdf>=4.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
]

[tool.setuptools.packages.find]
include = ["books*", "family_books*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "family_books.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "books"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as requiring a database",
    "e2e: marks tests as browser end-to-end",
]

[tool.coverage.run]
branch = true
source = ["books"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Coverage floor — Group G. Personal finance system handling real money;
# the loose-floor cost (untested code creeping in) is worse than the
# tight-floor cost (false-positive failures during refactor). 88% gives
# 3.6 points of headroom from the 91.6% measured at the close of Group
# F. pytest-cov reads this and exits non-zero if below; CI's `make
# test` step trips on the same threshold.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "C4",
    "DJ",
    "RUF",
]
ignore = [
    # S101 — assert allowed everywhere (Django/pytest pattern).
    "S101",
    # E501 — line length is enforced by `ruff format`, not the lint
    # rule. Don't double-gate.
    "E501",
    # N806 — `User = get_user_model()` is the canonical Django idiom
    # for getting the swappable user model. Treating Capitalized
    # local-variable names as a violation is a false positive in this
    # codebase (also fires on `Account = ...`, `JournalEntry = ...`
    # type-aliases that ruff misclassifies as "var should be lowercase").
    "N806",
    # N818 — ruff wants exception names to end in `Error`. Existing
    # exception names follow Django's older convention
    # (`PostedEntryImmutable`, `AlreadyReversed`, `CannotReverseAReversal`
    # — predicates, not "Error"). Renaming would touch every callsite
    # across Groups D-F; deferred to Group I cleanup so it's a
    # deliberate decision, not a mid-Group-G accident.
    "N818",
    # RUF012 — `Meta.indexes`, `Meta.constraints`, `Meta.ordering` look
    # like mutable class attribute defaults to ruff, but they're Django
    # model metadata, not instance state. Annotating them with
    # `ClassVar` to silence ruff would be Django-incompatible noise.
    "RUF012",
    # DJ001 — CharField + null=True. SystemFlag.setup_coa_mode uses this
    # in books/core/models.py; changing to default="" requires a data
    # migration to coerce existing NULL rows. Real fix deferred to
    # Group I cleanup punchlist; not blocking Group G.
    "DJ001",
    # DJ012 — Django Style Guide method ordering inside a Model. Ruff
    # wants `save` before `clean`. The codebase orders `clean` first
    # (validation logically runs before save) and the override pattern
    # for save sees the cleaned state. Stylistic preference; not a bug
    # surface. Group I cleanup if a broader Django-conformance pass
    # becomes worthwhile.
    "DJ012",
]

[tool.ruff.lint.per-file-ignores]
# Tests:
#   S101 — assert (already global-ignored, but per-file kept for
#          readability of the rule list).
#   S105/S106 — hardcoded passwords ("strong-password-77!!" etc) are
#          fixture data, not real secrets.
#   S311 — `random` for test data generation is fine; not a security
#          surface.
"tests/**" = ["S101", "S105", "S106", "S311"]
# Migrations:
#   E501 — auto-generated lines are long; ruff format doesn't touch
#          migrations (extend-exclude below).
#   N806 — Django's autogenerated `Migration = ...` references trip
#          the lower-case rule.
"**/migrations/**" = ["E501", "N806"]
# Dev settings:
#   S104 — `0.0.0.0` bind is intentional for Docker dev workflows
#          (the container's port mapping needs the all-interfaces
#          bind to be reachable from the host). Production settings
#          do NOT have this exemption.
"family_books/settings/dev.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "books.accounting.*"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.django-stubs]
django_settings_module = "family_books.settings.dev"
