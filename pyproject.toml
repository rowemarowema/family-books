[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "family-books"
version = "0.1.0"
description = "Single-user cloud-hosted personal finance system for the Rowe household"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mark Rowe" }]
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<1.0",
    "argon2-cffi>=23.1",
    "django-allauth>=64.0,<66.0",
    "django-two-factor-auth>=1.17,<2.0",
    "django-formtools>=2.5,<3.0",
    "django-axes>=7.0,<8.0",
    "openpyxl>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.7,<7.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "factory-boy>=3.3,<4.0",
    "faker>=30.0,<40.0",
    # Group F.4: cell-level tie-out test parses rendered HTML and
    # asserts each data-value matches the engine field. Test-only.
    "beautifulsoup4>=4.12,<5.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
]

[tool.setuptools.packages.find]
include = ["books*", "family_books*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "family_books.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "books"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as requiring a database",
    "e2e: marks tests as browser end-to-end",
]

[tool.coverage.run]
branch = true
source = ["books"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "C4",
    "DJ",
    "RUF",
]
ignore = [
    "S101",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "books.accounting.*"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.django-stubs]
django_settings_module = "family_books.settings.dev"
